version: "1.0.0"

taxonomy:
  version: "1.0.0"
  topics:
    # --- AI & Machine Learning ---
    - id: ai
      label: Artificial Intelligence
      description: Broad AI domain including ML, DL, NLP, and agentic systems
      aliases: [AI, artificial intelligence]

    - id: ai.ml
      label: Machine Learning
      description: Statistical and neural approaches to learning from data
      aliases: [ML, machine learning]

    - id: ai.ml.classification
      label: Text Classification
      description: Multi-label, multi-class, and binary text classification
      aliases: [text classification, multi-label classification, multilabel]

    - id: ai.ml.entity-matching
      label: Entity Matching & Resolution
      description: Matching and reconciling entities across data sources
      aliases: [entity matching, entity resolution, entity reconciliation, record linkage]

    - id: ai.ml.few-shot
      label: Few-shot & Zero-shot Learning
      description: Learning from minimal examples
      aliases: [few-shot learning, zero-shot, low-resource]

    - id: ai.ml.knowledge-distillation
      label: Knowledge Distillation
      description: Compressing large models into smaller, deployable ones
      aliases: [knowledge distillation, teacher-student, model compression]

    - id: ai.ml.transfer-learning
      label: Transfer Learning
      description: Reusing learned representations across tasks or domains
      aliases: [transfer learning, fine-tuning, domain adaptation]

    - id: ai.nlp
      label: Natural Language Processing
      description: Processing and understanding human language
      aliases: [NLP, natural language processing, text processing]

    - id: ai.deep-learning
      label: Deep Learning
      description: Neural network architectures including transformers, LSTMs, CNNs
      aliases: [DL, deep learning, neural networks]

    - id: ai.llm
      label: Large Language Models
      description: Foundation models, generative AI, prompt engineering
      aliases: [LLM, large language models, generative AI, foundation models]

    - id: ai.agentic
      label: Agentic AI
      description: Multi-agent systems, autonomous reasoning, LLM orchestration
      aliases: [agentic AI, multi-agent systems, AI agents]

    - id: ai.knowledge-graphs
      label: Knowledge Graphs
      description: Structured knowledge representation and graph-based reasoning
      aliases: [KG, knowledge graphs, knowledge graph science]

    # --- Distributed Systems ---
    - id: systems
      label: Distributed Systems
      description: Design and implementation of distributed computing systems
      aliases: [distributed systems, distributed computing]

    - id: systems.transactions
      label: Transaction Processing
      description: ACID transactions, snapshot isolation, distributed transactions
      aliases: [transactions, ACID, snapshot isolation, transactional systems]

    - id: systems.replication
      label: Replication & Consistency
      description: Data replication, consistency models, consensus protocols
      aliases: [replication, consistency, fault tolerance]

    - id: systems.streaming
      label: Stream Processing
      description: Real-time data ingestion and processing pipelines
      aliases: [streaming, stream processing, real-time processing]

    - id: systems.storage
      label: Storage Systems
      description: Databases, key-value stores, HBase, NoSQL
      aliases: [storage, databases, HBase, NoSQL]

    - id: systems.high-availability
      label: High Availability
      description: Fault-tolerant system design with minimal downtime
      aliases: [HA, high availability, fault tolerance]

    - id: systems.scalability
      label: Scalability
      description: Horizontal and vertical scaling of distributed systems
      aliases: [scalability, scaling, horizontal scaling]

    - id: systems.middleware
      label: Middleware
      description: Application servers, J2EE, service-oriented architectures
      aliases: [middleware, J2EE, application servers, SOA]

    # --- Software Engineering ---
    - id: engineering
      label: Software Engineering
      description: Software design, development practices, and tooling
      aliases: [software engineering, SWE]

    - id: engineering.mlops
      label: MLOps
      description: ML model deployment, serving, monitoring, and lifecycle
      aliases: [MLOps, ML engineering, model serving, ML infrastructure]

    - id: engineering.cloud
      label: Cloud Computing
      description: AWS, GCP, cloud migration, containerization
      aliases: [cloud, AWS, GCP, cloud computing, Docker, Kubernetes]

    - id: engineering.architecture
      label: Software Architecture
      description: System design, architectural patterns, API design
      aliases: [architecture, system design, software architecture]

    - id: engineering.data-pipelines
      label: Data Pipelines
      description: ETL, data processing, distributed data workflows
      aliases: [data pipelines, ETL, data processing, data engineering]

    - id: engineering.open-source
      label: Open Source
      description: Contributing to and maintaining open-source projects
      aliases: [open source, OSS, Apache]

    # --- Research & Academia ---
    - id: research
      label: Research & Academia
      description: Academic research, publications, teaching
      aliases: [research, academia, academic]

    - id: research.publications
      label: Publications
      description: Peer-reviewed papers at top venues
      aliases: [publications, papers, peer-reviewed]

    - id: research.patents
      label: Patents
      description: Intellectual property and patent applications
      aliases: [patents, IP, intellectual property]

    - id: research.teaching
      label: Teaching & Education
      description: Academic teaching and mentoring
      aliases: [teaching, education, lecturer]

    # --- Leadership & Strategy ---
    - id: leadership
      label: Leadership & Strategy
      description: Technical leadership, strategic advisory, team management
      aliases: [leadership, strategy, management]

    - id: leadership.strategy
      label: Strategic Advisory
      description: AI strategy, technology roadmaps, organizational guidance
      aliases: [strategy, advisory, technology strategy]

    - id: leadership.mentoring
      label: Mentoring & Collaboration
      description: Cross-team collaboration, knowledge transfer, mentoring
      aliases: [mentoring, collaboration, knowledge transfer]

