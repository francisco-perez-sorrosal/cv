          7+ international academic conferences; active open-source maintainer
          of mdbook-bib (Rust-based bibliography management tool).

interests:
  - name: Cognitive Sciences & Interdisciplinary
    description: >-
      Beyond my core professional focus, but some way related to it, I have a
      strong interest in the intersection of fields such as neuroscience,
      psychology, decision-making, cognitive sciences, learning techniques,
      behavioral economics, and philosophy, as they offer valuable insights
      into human behavior, intelligence, and how the brain works (and why!)
      I am deeply fascinated by the mechanisms of human thought, learning,
      and behavior, and how these insights can inform and inspire advancements
      in AI and our daily lives and wellbeing in general.
    keywords:
      - Neuroscience
      - Psychology
      - Decision-making
      - Cognitive Sciences
      - Learning Techniques
      - Behavioral Economics
      - Philosophy
  - name: Sports & Wellness
    description: >-
      In my personal life, I enjoy staying active through activities like
      running, mountain biking, yoga, cold-plunging, and playing tennis,
      which not only keep me physically fit but also provide a sense of
      balance and focus.
    keywords:
      - Running
      - Mountain Biking
      - Yoga
      - Cold-plunging
      - Tennis

