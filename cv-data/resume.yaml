        description: >-
          Presented research findings at both international and national
          conferences, effectively communicating complex ideas to diverse
          audiences. Delivered project updates in internal meetings within
          corporate environments. Authored 10+ peer-reviewed publications
          with extensive citations.
  - name: Professional Service
    items:
