  - id: work-yahoo-kgs-2023
    institution_id: inst-yahoo
    location: Sunnyvale
    department: Knowledge Graph Science
    position: Principal Research Engineer
    start_date: "2023"
    end_date: "2024"
    summary: ML/AI Expert and MLOps roles in Knowledge Graph team.
    roles:
      - ML/AI Expert
      - MLOps
    highlights: []
    projects:
      - id: proj-dataset-quality-2024
        name: Dataset Quality Improvement
        start_date: "2024"
        end_date: "2024"
        goal: >-
          Since the labels of most entity pairs were generated in a
          semi-supervised manner, develop an LLM-based solution to validate and
          enhance the labeling accuracy of the dev and test datasets.
        highlights: []
        achievements:
          - >-
            Implemented a generative Entity Matching solution with Llama 2
            to identify and fix (by re-labeling) misclassified examples in
            the dev/test sets.
        keywords:
          - LLM
          - Entity Matching
          - Llama 2
          - Data Quality
        roles:
          - ML/AI Expert

      - id: proj-entity-reconciliation-training-2023
        name: Entity Reconciliation Model Training
        start_date: "2023"
        end_date: "2024"
        description: >-
          Fine-tuned transformer-based language models on heterogeneously
          labeled datasets, integrating editorially curated data with
          automatically labeled data through entity linking via common
          identifiers. This approach aimed to deduplicate and reconcile
          meta-entities related to People and Creative Works.
        goal: >-
          Improve current production metrics on People and Creative Works
          entity reconciliation by fine-tuning transformer-based language
          models on heterogeneously labeled datasets.
        highlights: []
        achievements:
          - >-
            Trained and optimized a unified, type-agnostic LM model for entity
            matching/reconciliation, replacing tens of type-specific production
            models and simplifying the maintenance of the reconciliation stage
            in the Knowledge Graph.
          - >-
            Metric improvements: overall increases of 22.23% and 16.11% in
            precision and recall for Person, and 5% and 4% for Creative Works.
          - >-
            Reduced model size by 33%, lowering storage requirements and
            improving efficiency without compromising accuracy.
        keywords:
          - Transformers
          - Entity Matching
          - Knowledge Graphs
          - Fine-tuning
        roles:
          - ML/AI Expert

      - id: proj-entity-reconciliation-pipeline-2023
        name: Entity Reconciliation Pipeline
        start_date: "2023"
        end_date: "2023"
        goal: >-
          Build pipelines for distributed sampling, preprocessing, and
          transformation of large-scale entity data extracted from various
          complementary sources that accurately reflect user search behavior.
        description: >-
          Developed an automated pipeline for training entity reconciliation
          models for YK, from data curation to inference testing.
        highlights: []
        achievements:
          - >-
            Devised a solution to reduce the number of models maintained in
            production from ≈ 30 heterogeneous (heuristic-based, SVMs,
            Tree-based) to just 4, which encompass the main 4 meta-entity
            types in YK.
          - >-
            Expanded entity type coverage to 20 new types of people entities
            (e.g., directors, producers, composers, writers, politicians) and
            32 new types of creative works (e.g., visual works, theatrical
            works, critic's reviews, periodicals, poems).
        keywords:
          - Data Pipelines
          - Entity Resolution
          - Distributed Processing
        roles:
          - ML/AI Expert

      - id: proj-entity-reconciliation-inference-2023
        name: Entity Reconciliation Inference
        start_date: "2023"
        end_date: "2023"
        goal: Design and architect a PoC solution for cloud-based inference.
        highlights: []
        achievements:
          - >-
            Implemented a Ray Serve-based solution to deploy new YK models in
            the cloud, optimizing for cost efficiency by evaluating CPU and
            GPU-based approaches.
        keywords:
          - Ray Serve
          - Cloud Inference
          - MLOps
        roles:
          - MLOps

  - id: work-yahoo-mail-2022
    institution_id: inst-yahoo
    location: Sunnyvale
    department: Mail
    employer_display: "Mail @ Yahoo"
    position: Principal Research Engineer
    start_date: "2022-06"
    end_date: "2022-12"
    summary: ML/AI Expert for Mail classification system.
    roles:
      - ML/AI Expert
    highlights: []
    projects:
      - id: proj-kamino-mail-classification-2022
        name: Kamino Project - Mail Classification System
        start_date: "2022-06"
        end_date: "2022-12"
        goal: >-
          Upgrade legacy production models to a new generation of deep
          learning-based, small distilled models optimized for large-scale
          deployment. These models were designed to classify incoming mail
          using a newly developed multilabel taxonomy tailored to the mail
          team's specific use cases.
        description: >-
          Developed a deep learning pipeline using Hugging Face to
          train/evaluate models based on the Teacher/Student knowledge
          distillation framework. Starting with limited human-labeled training
          data, a large and complex teacher model was created to achieve high
          accuracy. This model was then used to generate teacher-labeled data
          for training lightweight student models optimized for deployment.
          Two types of student models were produced: (1) online models,
          optimized for speed and suitable for real-time classification tasks,
          and (2) offline models, designed to include richer information for
          improved accuracy in non-real-time applications.
        description_label: Approach
        highlights: []
        achievements:
          - >-
            The resulting student models for an expanded taxonomy, more than
            doubling the number of deployable categories in the taxonomy while
            improving performance on existing categories in production by
            3.1-5.9%.
        keywords:
          - Knowledge Distillation
          - HuggingFace Transformers
          - Multi-label Classification
          - Deep Learning
        roles:
          - ML/AI Expert

  - id: work-yahoo-dto-2022
    institution_id: inst-yahoo
    location: Sunnyvale
    department: Digital Transformation Office
    employer_display: "Digital Transformation Office @ Yahoo"
    position: Technical Advisor
    start_date: "2022-04"
    end_date: "2022-12"
    summary: ML/AI Expert and Strategy roles for AI/ML cloud migration.
    roles:
      - ML/AI Expert
      - Strategy
    highlights: []
    projects:
      - id: proj-aiml-working-group-2022
        name: AI/ML Working Group - AI/ML Future Strategy Definition in the Cloud
        start_date: "2022-04"
        end_date: "2022-12"
        description: >-
          As Yahoo transitioned its infrastructure from on-premises data
          centers to a fully cloud-based environment, scientists and research
          engineers required modern tools to streamline their workflows. These
          tools needed to facilitate dataset and model sharing, ensure
          reproducibility of experiments, enable rapid experimentation and
          iteration on new models, and support seamless publishing and
          deployment into pre-production/production environments.
        goal: >-
          Specifically, the Model Development subgroup was dedicated to
          establishing the requirements, standards, tools, and frameworks
          needed to scale ML/DL applications effectively across the company
          during the transition from on-premises to cloud-based infrastructure.
        highlights: []
        achievements:
          - >-
            Led the discussions on the Model Development subgroup, although
            participated actively in the remaining three (Data Management,
            Model Management, and Model Serving).
          - >-
            Delivered a set of recommendations (prioritized and categorized in
            topics) and tasks to do (internal processes, external relations,
            tools, etc.) to guarantee that ML/DL practitioners could work with
            less friction in the new cloud environments.
        keywords:
          - MLOps
          - Cloud Migration
          - Strategy
          - AI Infrastructure
        roles:
          - Strategy
          - ML/AI Expert

  - id: work-yahoo-ads-2021
    institution_id: inst-yahoo
    location: Sunnyvale
    department: Ads
    employer_display: "Ads @ Yahoo"
    position: Principal Research Engineer
    start_date: "2021"
    end_date: "2022"
    summary: ML/AI Expert and Strategy roles in Ads contextual targeting.
    roles:
      - ML/AI Expert
      - Strategy
    highlights: []
    projects:
      - id: proj-contextual-targeting-2021
        name: Contextual Targeting Solution
        start_date: "2021"
        end_date: "2022"
        description: >-
          In the Ads platform, as we were moving towards a cookie-less world,
          the ability to track users' online signals for behavioral targeting
          would be drastically reduced, making contextual targeting an
          appealing alternative for advertising platforms. Using our experience
          in hierarchical multilabel classification in other contexts, we
          helped the Ads team to use it in category-based contextual targeting
          at Yahoo. We proposed and implemented a multilingual model that can
          accurately classify web pages into a hierarchical taxonomy
          (specifically, the Yahoo Interest Categories taxonomy) without
          crawling their content.
        goal: >-
          Transfer the knowledge and experience in taxonomy-based multi-label
          classification to the Ads team and build a platform for
          training/evaluating the models for category-based contextual
          targeting in a cookie-less world.
        highlights: []
        achievements:
          - >-
            Helped the Ads team to develop a pipeline for training models for
            the task at hand.
          - >-
            Paper published: 'Multilingual taxonomic web page classification
            for contextual targeting at Yahoo' (ACM SIGKDD 2022, 7 Citations).
        keywords:
          - Contextual Targeting
          - Multi-label Classification
          - Multilingual Models
          - Advertising
        roles:
          - ML/AI Expert

