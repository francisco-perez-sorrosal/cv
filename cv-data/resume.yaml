      - id: proj-few-shot-classification-2021
        name: Scalable Few-shot Classification with Parallel Prefix Conditioning
        start_date: "2021"
        end_date: "2021"
        goal: >-
          Modify a transformer architecture (e.g. BERT) to achieve fast and
          effective few-shot classification by prefixing multiple category
          labels to the input.
        description: >-
          Class representations are encoded in parallel but produce independent
          binary labels for each input through a shared classification output
          layer.
        description_label: Method
        highlights: []
        achievements:
          - >-
            Conducted experiments on the DBPedia dataset demonstrating improved
            few-shot performance over standard multi-class classifiers and a
            speedup over binarized formulations.
          - >-
            Further analysis showed that the approach could be scaled to a
            large number of categories and may hold promise for zero-shot
            learning of unseen categories.
        keywords:
          - Few-shot Learning
          - Transformers
          - BERT
          - Classification
        roles:
          - Research Engineer

      - id: proj-clickbait-classifier-2019
        name: Clickbait Classifier based on Transformers
        start_date: "2019"
        end_date: "2019"
        goal: Improve the current SVM-based model in production using a BERT-based model.
        highlights: []
        achievements:
          - >-
            Proposed an integration strategy for serving the model in
            production using the existing pipeline.
          - Improved F1 metric over 5% compared to current classifier in production.
          - PoC of a generative-based clickbait classification approach using Google's T5.
        keywords:
          - BERT
          - Text Classification
          - NLP
          - T5
        roles:
          - ML/DL Engineer

      - id: proj-hierarchical-transfer-learning-2018
        name: Hierarchical Transfer Learning for Multi-label Text Classification
        start_date: "2018"
        end_date: "2018"
        goal: >-
          Propose a novel transfer learning based strategy where binary
          classifiers at lower levels in a hierarchy of classes are initialized
          using parameters of the parent classifier and subsequently fine-tuned
          on the child categories for the classification task.
        highlights: []
        achievements:
          - >-
            Paper published in ACL 2019: 'Hierarchical transfer learning for
            multi-label text classification'. 127 Citations.
        keywords:
          - Transfer Learning
          - Multi-label Classification
          - Hierarchical Classification
          - NLP
        roles:
          - Research Engineer

